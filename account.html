<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>TURAVOZ — Account</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5f6f8;
  color:#111;
}

.header{
  background:#0b0b0b;
  color:#fff;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#d4af37;
}

.back{
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:520px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 35px #00000012;
}

.title{
  text-align:center;
  margin-bottom:22px;
}

.title h1{
  font-size:28px;
  margin-bottom:7px;
}

.title p{
  color:#777;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#f0f1f3;
  padding:5px;
  border-radius:13px;
  margin-bottom:20px;
}

.tab{
  border:0;
  padding:12px;
  border-radius:10px;
  background:transparent;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#0b0b0b;
  color:#fff;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 6px;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#111;
}

.password{
  position:relative;
}

.password button{
  position:absolute;
  right:10px;
  top:9px;
  border:0;
  background:#eee;
  border-radius:8px;
  padding:7px;
}

.main-btn{
  width:100%;
  border:0;
  background:#0b0b0b;
  color:#fff;
  padding:15px;
  border-radius:13px;
  font-weight:bold;
  font-size:15px;
  margin-top:18px;
  cursor:pointer;
}

.gold-btn{
  width:100%;
  border:0;
  background:#d4af37;
  color:#000;
  padding:14px;
  border-radius:13px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0;
  color:#999;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#ddd;
  flex:1;
}

.link{
  color:#555;
  text-align:center;
  margin-top:15px;
  font-size:13px;
}

.link a{
  color:#111;
  font-weight:bold;
}

.hidden{
  display:none;
}

.role{
  margin-top:18px;
  padding:15px;
  border:1px solid #eee;
  border-radius:14px;
}

.role-title{
  font-weight:bold;
  margin-bottom:10px;
}

.role-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.role-option{
  border:1px solid #ddd;
  padding:12px;
  border-radius:11px;
  text-align:center;
  cursor:pointer;
}

.role-option.selected{
  border-color:#111;
  background:#f2f2f2;
  font-weight:bold;
}

.security{
  text-align:center;
  margin-top:20px;
  color:#777;
  font-size:12px;
}

.footer{
  text-align:center;
  color:#888;
  padding:20px;
  font-size:12px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TURA<span>VOZ</span></div>
  <a class="back" href="index.html">← Home</a>
</header>

<div class="container">

<div class="card">

<div class="title">
  <h1>My Account</h1>
  <p>Welcome to TURAVOZ</p>
</div>

<div class="tabs">
  <button class="tab active" id="loginTab" onclick="showLogin()">
    Login
  </button>

  <button class="tab" id="signupTab" onclick="showSignup()">
    Create Account
  </button>
</div>

<!-- LOGIN -->

<div id="loginBox">

<label>Email or Mobile</label>
<input
  class="input"
  id="loginUser"
  type="text"
  placeholder="Enter email or mobile"
>

<label>Password</label>

<div class="password">
<input
  class="input"
  id="loginPassword"
  type="password"
  placeholder="Enter password"
>
<button onclick="togglePassword('loginPassword')">👁</button>
</div>

<button class="main-btn" onclick="login()">
  Login Securely
</button>

<button class="gold-btn" onclick="passkeyLogin()">
  🔐 Fingerprint / Passkey
</button>

<div class="link">
  <a href="#" onclick="forgotPassword();return false;">
    Forgot password?
  </a>
</div>

</div>

<!-- SIGNUP -->

<div id="signupBox" class="hidden">

<label>Your Name</label>
<input
  class="input"
  id="name"
  type="text"
  placeholder="Enter your name"
>

<label>Email</label>
<input
  class="input"
  id="email"
  type="email"
  placeholder="Enter email"
>

<label>Mobile Number</label>
<input
  class="input"
  id="mobile"
  type="tel"
  placeholder="03XXXXXXXXX"
>

<label>Create Password</label>

<div class="password">
<input
  class="input"
  id="signupPassword"
  type="password"
  placeholder="Create password"
>
<button onclick="togglePassword('signupPassword')">👁</button>
</div>

<div class="role">
<div class="role-title">Account Type</div>

<div class="role-options">

<div
  class="role-option selected"
  id="buyerRole"
  onclick="selectRole('buyer')">
  🛒 Customer
</div>

<div
  class="role-option"
  id="sellerRole"
  onclick="selectRole('seller')">
  🏪 Seller
</div>

</div>
</div>

<button class="main-btn" onclick="createAccount()">
  Create TURAVOZ Account
</button>

</div>

<div class="security">
  🔒 Your account information is protected.
</div>

</div>
</div>

<footer class="footer">
© 2026 TURAVOZ — Pakistan's Online Marketplace
</footer>

<script>

let selectedRole = "buyer";

function showLogin(){

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("signupBox")
    .classList.add("hidden");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");
}

function showSignup(){

  document.getElementById("signupBox")
    .classList.remove("hidden");

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("signupTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");
}

function selectRole(role){

  selectedRole = role;

  document.getElementById("buyerRole")
    .classList.remove("selected");

  document.getElementById("sellerRole")
    .classList.remove("selected");

  if(role === "buyer"){
    document.getElementById("buyerRole")
      .classList.add("selected");
  }else{
    document.getElementById("sellerRole")
      .classList.add("selected");
  }
}

function togglePassword(id){

  const field = document.getElementById(id);

  field.type =
    field.type === "password"
    ? "text"
    : "password";
}

function createAccount(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if(!name || !email || !mobile || !password){

    alert("Please complete all required fields.");
    return;
  }

  localStorage.setItem(
    "turavozUserName",
    name
  );

  localStorage.setItem(
    "turavozUserEmail",
    email
  );

  localStorage.setItem(
    "turavozUserMobile",
    mobile
  );

  localStorage.setItem(
    "turavozUserRole",
    selectedRole
  );

  alert(
    "Account created successfully!\n\n" +
    "Welcome to TURAVOZ, " + name + "!"
  );

  if(selectedRole === "seller"){
    window.location.href = "seller.html";
  }else{
    window.location.href = "index.html";
  }
}

function login(){

  const user =
    document.getElementById("loginUser").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!user || !password){

    alert("Please enter your login details.");
    return;
  }

  const name =
    localStorage.getItem("turavozUserName") || "User";

  const role =
    localStorage.getItem("turavozUserRole") || "buyer";

  alert("Login successful. Welcome " + name + "!");

  if(role === "seller"){
    window.location.href = "seller.html";
  }else{
    window.location.href = "index.html";
  }
}

function forgotPassword(){

  const mobile =
    prompt("Enter your registered mobile number:");

  if(mobile){

    alert(
      "Password recovery request received.\n" +
      "OTP verification will be connected with the backend."
    );
  }
}

function passkeyLogin(){

  if(window.PublicKeyCredential){

    alert(
      "Fingerprint / Passkey is supported on this device.\n\n" +
      "Final secure authentication requires HTTPS and a backend."
    );

  }else{

    alert(
      "Fingerprint / Passkey is not available in this browser."
    );
  }
}

</script>

</body>
</html>
